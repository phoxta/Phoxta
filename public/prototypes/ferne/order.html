<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%235F6F52%27/%3E%3Cpath d=%27M16 8c-4 3-5 7-3 11 2-1 5-4 3-11zm0 0c4 3 5 7 3 11-2-1-5-4-3-11z%27 fill=%27%23F3F0EA%27/%3E%3C/svg%3E">
<meta name="description" content="Ferne order confirmation — your receipt, delivery estimate and next steps.">
<title>Order confirmed — Ferne</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="page"><div class="wrap" style="max-width:820px">
  <div class="confirm"><div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
    <div class="eyebrow">Thank you</div><h1 class="serif">Your ritual is on its <em>way</em></h1><p class="muted" style="margin-top:12px">We've emailed a receipt to <b data-email></b>.</p><div class="order-no">Order <b data-id></b></div></div>
  <div class="timeline"><div><b>✓ Confirmed</b>Just now</div><div class="next"><b>Packed</b>Within 24 hours</div><div class="next"><b>Shipped</b><span data-eta></span></div><div class="next"><b>Delivered</b>Tracking by email</div></div>
  <div class="card-box"><h3 class="serif" style="font-size:24px;font-weight:400;margin-bottom:12px">Items</h3><div data-lines></div><div data-sums style="margin-top:12px"></div></div>
  <div class="about-grid"><div class="info-tile"><b>Deliver to</b><span data-addr></span></div><div class="info-tile"><b>What next</b>Track this order and start returns from your <a class="link" href="account.html#orders">account</a>. Questions? <a class="link" href="contact.html">Contact us</a>.</div></div>
  <div style="text-align:center;margin-top:32px"><a class="btn" href="shop.html">Continue shopping <span class="arr">→</span></a></div>
</div></main>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
document.addEventListener("ferne:ready",()=>{const {$,qs,money,esc,Orders}=Ferne;const o=Orders.all().find(x=>x.id===qs.get("id"))||Orders.all()[0];if(!o){location.replace("shop.html");return;}
  $("[data-id]").textContent=o.id;$("[data-email]").textContent=o.address.email;$("[data-eta]").textContent=o.ship.eta;$("[data-addr]").textContent=`${o.address.first} ${o.address.last}, ${o.address.addr}, ${o.address.city} ${o.address.postcode}, ${o.address.country}`;
  $("[data-lines]").innerHTML=o.lines.map(l=>`<div class="line" style="grid-template-columns:52px 1fr auto;padding:10px 0"><div class="ph" style="width:52px;height:62px"><img src="${l.img}" alt=""></div><div><b>${esc(l.name)}</b><small>${esc(l.size)} × ${l.qty}</small></div><div class="amt">${money(l.total)}</div></div>`).join("");
  const t=o.totals;$("[data-sums]").innerHTML=`<div class="sum"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.discount?`<div class="sum"><span>Discount</span><span class="free">−${money(t.discount)}</span></div>`:""}<div class="sum"><span>Delivery · ${o.ship.name}</span><span>${t.shipping?money(t.shipping):"Free"}</span></div><div class="sum total"><span>Total paid</span><span>${money(t.total)}</span></div>`;});
</script><style data-pf-backchip>
.pf-backchip{position:fixed;left:14px;bottom:14px;z-index:2147483000;display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:999px;background:rgba(20,18,22,.88);color:#fff;font:500 12.5px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  text-decoration:none;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px -14px rgba(0,0,0,.6);backdrop-filter:blur(8px);
  transition:transform .2s ease,background .2s ease}
.pf-backchip:hover{transform:translateY(-2px);background:#F0460E;color:#fff}
.pf-backchip:focus-visible{outline:2px solid #F0460E;outline-offset:3px}
@media (max-width:768px){.pf-backchip{display:none}}
</style>
<a class="pf-backchip" href="https://femi.phoxta.com/work/ferne">← Ferne case study</a>
</body></html>
