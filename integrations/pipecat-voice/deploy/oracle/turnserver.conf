# Phoxta self-hosted TURN.
#
# The browser voice widget previously relayed all its media through Twilio's
# TURN, which bills per GB. This box has spare capacity and a public IP, so it
# can relay its own. Twilio TURN stays configured as a fallback in server.py —
# if this ever fails, calls degrade rather than drop.

listening-port=3478
fingerprint

# Time-limited credentials (RFC 5766 TURN REST API): the voice server mints a
# username of "<expiry-unix>" and a password of base64(HMAC-SHA1(secret, user)).
# No long-lived shared password ever reaches a browser.
use-auth-secret
static-auth-secret=REPLACED_AT_INSTALL
realm=phoxta.com

# The VM only knows its private address; ICE candidates must advertise the
# public one or every relay candidate is unreachable.
listening-ip=0.0.0.0
external-ip=EXTERNAL_IP_AT_INSTALL

# Kept deliberately narrow: every port in this range must also be open in the
# OCI security list and the host firewall, and a smaller range keeps those rules
# (and the attack surface) manageable. ~420 ports is plenty of concurrent relays
# at this scale — each session uses one.
min-port=49152
max-port=49570

# Refuse to relay to private ranges, so the TURN server can't be used to probe
# the VM's own network or anyone else's.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

no-cli
no-tlsv1
no-tlsv1_1
syslog
